<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi tiết tỉnh thành — Việt Nam Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f7f2;--ink:#1a2b22;--muted:#667768;--line:#dde4d6;
  --accent:#2b593f;--card-bg:#ffffff;--soft:#eef3e8;
  font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
  color:var(--ink);background:var(--paper);
}
*{box-sizing:border-box}body{margin:0;line-height:1.65;background:var(--paper)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}

/* Top bar */
.top-nav{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 5%;background:rgba(245,247,242,0.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.back-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:#ffffff;border:1px solid var(--line);
  padding:8px 16px;border-radius:24px;
  font-size:12.5px;font-weight:600;color:#284330;
  transition:all .18s ease;box-shadow:0 2px 8px rgba(0,0,0,0.03);
}
.back-btn:hover{background:#e7efe0;border-color:#b9ccaf;transform:translateX(-2px)}
.top-title{font-size:13px;font-weight:700;color:#45604b;letter-spacing:1px;text-transform:uppercase}
.top-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:6px 12px;background:#e2ebda;color:#23442a;border-radius:20px;font-weight:600}
.top-dot{width:7px;height:7px;border-radius:50%;background:#10b981}

/* Container */
.page-wrap{max-width:1200px;margin:auto;padding:28px 5% 60px}

/* Province Switcher & Region Filter */
.region-switcher{
  background:#ffffff;border:1px solid var(--line);border-radius:20px;
  padding:16px 20px;margin-bottom:28px;box-shadow:0 4px 18px rgba(35,55,35,0.04);
}
.region-tabs{
  display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px;
  border-bottom:1px solid #edf2e8;scrollbar-width:none;
}
.region-tabs::-webkit-scrollbar{display:none}
.reg-tab-btn{
  padding:5px 12px;border-radius:14px;border:1px solid #dce4d4;
  background:#f7f9f4;font-size:11px;font-weight:600;color:#546850;
  white-space:nowrap;transition:all .18s;
}
.reg-tab-btn:hover{background:#e8f0e0;color:#1e3522}
.reg-tab-btn.is-active{background:#25442f;color:#ffffff;border-color:#25442f}

.switcher-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.switcher-pills::-webkit-scrollbar{display:none}
.switch-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:20px;
  border:1px solid #dce4d4;background:#f9fbf7;
  font-size:11.5px;font-weight:600;color:#334835;
  white-space:nowrap;transition:all .18s;
}
.switch-pill:hover{background:#edf4e6;border-color:#b7caa9;transform:translateY(-1px)}
.switch-pill.is-current{
  background:#233f2c;color:#ffffff;border-color:#233f2c;
  box-shadow:0 4px 12px rgba(35,63,44,0.25);
}
.switch-pill .p-dot{width:7px;height:7px;border-radius:50%}

/* Hero section */
.hero{
  display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:36px;
  background:#ffffff;border:1px solid var(--line);border-radius:24px;
  padding:36px;margin-bottom:32px;box-shadow:0 8px 30px rgba(35,55,35,0.04);
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:0;right:0;width:340px;height:100%;
  background:radial-gradient(circle at 80% 30%, rgba(144,195,140,0.15), transparent 70%);
  pointer-events:none;
}
.hero-tag{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11.5px;font-weight:650;color:#355639;
  background:#e7f0e0;padding:5px 12px;border-radius:20px;margin-bottom:14px;
}
.hero-name{
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(32px,3.8vw,48px);font-weight:700;
  line-height:1.15;letter-spacing:-1px;margin:0 0 12px;color:#183220;
}
.hero-quote{
  font-size:14px;font-weight:550;color:#5a755d;
  font-style:italic;margin:0 0 16px;line-height:1.5;
}
.hero-desc{
  font-size:13.5px;line-height:1.85;color:#4a594d;margin:0;max-width:680px;
}
.hero-visual{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#f3f7ee,#e7eee0);
  border:1px solid #dbe4d4;border-radius:20px;padding:24px 20px;text-align:center;
}
.silhouette-img{max-width:180px;max-height:180px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(35,55,35,0.18))}
.hero-id-tag{margin-top:14px;font-size:11px;font-weight:700;letter-spacing:1.5px;color:#5a7356;text-transform:uppercase}

/* Key Stats Grid */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.stat-card{
  background:#ffffff;border:1px solid var(--line);border-radius:18px;
  padding:20px;box-shadow:0 4px 16px rgba(35,55,35,0.03);
  transition:transform .18s,box-shadow .18s;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(35,55,35,0.06)}
.stat-label{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#70826d;margin-bottom:6px}
.stat-val{font-size:21px;font-weight:750;letter-spacing:-.6px;color:#1d3926;margin-bottom:4px;line-height:1.2}
.stat-sub{font-size:11px;color:#7a8a76}

/* Content Sections */
.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:32px}
.card{
  background:#ffffff;border:1px solid var(--line);border-radius:20px;
  padding:26px;box-shadow:0 4px 18px rgba(35,55,35,0.03);
}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:18px;border-bottom:1px solid #edf2e8;padding-bottom:12px}
.card-icon{width:32px;height:32px;border-radius:8px;background:#e9f0e2;display:grid;place-items:center;color:#2f5337;font-size:16px}
.card-title{font-size:16px;font-weight:700;letter-spacing:-.3px;color:#1e3523;margin:0}
.info-list{margin:0;padding-left:18px;color:#445747;font-size:13px;line-height:1.85}
.info-list li{margin-bottom:10px}

/* Highlights Gallery */
.highlights-section{margin-bottom:40px}
.section-title{
  display:flex;align-items:center;gap:12px;
  font-family:'Playfair Display',Georgia,serif;
  font-size:26px;font-weight:700;color:#183220;margin:0 0 20px;
}
.section-title::after{content:'';flex:1;height:1px;background:var(--line)}
.highlights-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.highlight-card{
  background:#ffffff;border:1px solid var(--line);border-radius:20px;
  overflow:hidden;box-shadow:0 6px 22px rgba(35,55,35,0.04);
  display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;
}
.highlight-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(35,55,35,0.09)}
.img-wrap{
  position:relative;width:100%;height:250px;background:#e6ede0;overflow:hidden;cursor:zoom-in;
}
.highlight-img{
  width:100%;height:100%;object-fit:cover;transition:transform .4s ease;
}
.highlight-card:hover .highlight-img{transform:scale(1.04)}
.img-badge{
  position:absolute;top:14px;left:14px;background:rgba(20,38,25,0.82);
  color:#ffffff;font-size:10px;font-weight:600;padding:4px 9px;border-radius:12px;
  backdrop-filter:blur(6px);
}
.highlight-body{padding:22px;flex:1;display:flex;flex-direction:column}
.highlight-title{font-size:17px;font-weight:700;color:#1b3622;margin:0 0 8px}
.highlight-caption{font-size:11.5px;font-weight:600;color:#5a755d;margin:0 0 10px}
.highlight-desc{font-size:12.5px;line-height:1.75;color:#4d5f50;margin:0}

/* Heritage & Links bottom cards */
.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:40px}
.badge-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.heritage-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:7px 12px;border-radius:10px;background:#edf4e7;color:#28482d;
  border:1px solid #dbe6d3;
}
.link-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ext-link{
  display:inline-flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-radius:10px;background:#f8faf6;border:1px solid #dce4d5;
  font-size:12.5px;font-weight:600;color:#23442a;transition:all .18s;
}
.ext-link:hover{background:#edf5e5;border-color:#b5caa6;transform:translateX(3px);color:#122918}

/* Lightbox Modal */
.modal{
  position:fixed;inset:0;z-index:100;background:rgba(12,22,15,0.92);
  backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:30px;
}
.modal.is-open{display:flex}
.modal-content{max-width:92vw;max-height:88vh;border-radius:16px;overflow:hidden;position:relative}
.modal-img{max-width:100%;max-height:85vh;object-fit:contain;display:block}
.modal-caption{
  background:#1a2b1f;color:#e8f0e4;font-size:13px;padding:12px 18px;text-align:center;font-weight:500;
}
.modal-close{
  position:absolute;top:20px;right:24px;color:#ffffff;background:rgba(255,255,255,0.2);
  border:0;width:38px;height:38px;border-radius:50%;font-size:22px;display:grid;place-items:center;
}
.modal-close:hover{background:rgba(255,255,255,0.35)}

/* Bottom page navigation */
.page-nav-btns{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  margin-top:20px;padding-top:24px;border-top:1px solid var(--line);
}
.nav-link-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:12px;background:#ffffff;border:1px solid var(--line);
  font-size:12.5px;font-weight:650;color:#2b4830;transition:all .18s;
}
.nav-link-btn:hover{background:#edf4e7;border-color:#b9ccaf;transform:translateY(-1px)}

/* Responsive */
@media(max-width:950px){
  .hero{grid-template-columns:1fr;padding:26px}
  .hero-visual{order:-1;padding:18px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .section-grid,.highlights-grid,.bottom-grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .stats-grid{grid-template-columns:1fr}
  .page-wrap{padding:20px 4% 40px}
  .hero-name{font-size:28px}
  .stat-val{font-size:19px}
  .img-wrap{height:200px}
}
</style>
</head>

<header class="top-nav">
  <a href="./index.html" class="back-btn" title="Quay lại bản đồ tương tác Việt Nam">

  <div class="top-title">VIỆT NAM ATLAS</div>

<main class="page-wrap">

      <div class="badge-list" id="heritage-list"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-icon">🔗</div>
        <h3 class="card-title">Hình ảnh tham khảo & Cổng thông tin</h3>
      </div>
      <div class="link-list" id="links-list"></div>
    </div>
  </section>

  <!-- Next / Prev Province Navigator -->
  <div class="page-nav-btns">
    <button type="button" class="nav-link-btn" id="prev-btn">← Tỉnh trước</button>
    <a href="./index.html" class="nav-link-btn" style="background:#284831;color:#fff;border-color:#284831">Bản đồ toàn quốc ↗</a>
    <button type="button" class="nav-link-btn" id="next-btn">Tỉnh tiếp theo →</button>
  </div>
</main>

<!-- Lightbox Modal -->
<div class="modal" id="image-modal" role="dialog" aria-modal="true" aria-label="Phóng to ảnh">
  <button class="modal-close" id="modal-close" aria-label="Đóng">✕</button>
  <div class="modal-content">
    <img id="modal-img" class="modal-img" src="" alt="">
    <div id="modal-caption" class="modal-caption"></div>
  </div>
</div>

 "Dịch vụ 41,8%", "sub": "CN-XD 28% · Nông nghiệp 25,8%"}], "sections": [{"title": "Vị trí địa lý & Điều kiện tự nhiên", "icon": "geo", "content": ["Vị trí: Nằm ở trung tâm vùng Đông Bắc Bộ, tiếp giáp với các tỉnh Cao Bằng, Thái Nguyên, Phú Thọ, Lào Cai và có đường biên giới quốc gia.", "Địa hình: Chủ yếu là đồi núi hiểm trở, bị chia cắt mạnh bởi các dãy núi cao cùng hệ thống sông suối lớn như sông Lô và sông Gâm.", "Khí hậu: Nhiệt đới gió mùa vùng núi, mùa đông lạnh mát, mùa hè ôn hòa, tạo điều kiện thuận lợi phát triển lâm nghiệp và cây ăn quả đặc sản."]}, {"title": "Dân số, Hành chính & Con người", "icon": "users", "content": ["Quy mô dân số đạt trên 1,86 triệu người, là nơi hội tụ sinh sống gắn bó của nhiều đồng bào dân tộc anh em như Tày, Dao, Mông, Nùng, Kinh, Sán Dìu...", "Đơn vị hành chính gồm 7 phường và 117 xã. Thủ phủ đặt tại Phường Minh Xuân, trung tâm kinh tế - chính trị - văn hóa của toàn tỉnh."]}, {"title": "Kinh tế & Định hướng phát triển", "icon": "trend", "content": ["Cơ cấu kinh tế: Ngành dịch vụ chiếm tỷ trọng lớn nhất (khoảng 41,79%), tiếp theo là công nghiệp - xây dựng (27,99%) và nông - lâm - thủy sản (25,77%).", "Định hướng: Tỉnh tập trung phát triển du lịch sinh thái - lịch sử, nông nghiệp công nghệ cao và thu hút các ngành công nghiệp chế biến sâu."]}], "highlights": [{"title": "Cột cờ Quốc gia Lũng Cú & Cao nguyên đá", "image": "assets/images/image1.jpeg", "caption": "Cột cờ Quốc gia Lũng Cú kiêu hãnh trên đỉnh núi Rồng", "desc": "Cột cờ Quốc gia Lũng Cú là biểu tượng thiêng liêng nơi địa đầu Tổ quốc, nằm giữa cảnh quan hùng vĩ của Cao nguyên đá Đồng Văn. Nổi bật trên đỉnh núi Rồng, lá cờ đỏ sao vàng 54m² tung bay giữa núi đá trùng điệp, bản làng vùng cao và những thửa ruộng uốn lượn, khẳng định chủ quyền quốc gia vững chắc."}, {"title": "Kỳ quan Cao nguyên đá Đồng Văn", "image": "assets/images/image2.jpeg", "caption": "Cảnh sắc kỳ vĩ của Công viên Địa chất Cao nguyên đá", "desc": "Những vạt núi đá vôi xám tai mèo trải dài bất tận hòa cùng cuộc sống kiên cường của đồng bào vùng cao tạo nên một bức tranh thiên nhiên và nhân văn vô cùng độc đáo."}, {"title": "Mật ong bạc hà Mèo Vạc", "image": "assets/images/image3.jpeg", "caption": "Mật ong hoa bạc hà tự nhiên sánh vàng quyến rũ trên cao nguyên đá", "desc": "Được tạo nên từ nguồn hoa bạc hà tự nhiên mọc trên các vách đá vôi cao nguyên, mật ong có màu vàng chanh óng ánh, vị ngọt thanh mát và hương thơm thảo mộc đặc trưng hiếm có."}, {"title": "Cam sành Hàm Yên", "image": "assets/images/image4.jpeg", "caption": "Thu hoạch cam sành Hàm Yên quả vỏ sần tép vàng mọng nước", "desc": "Cam sành Hàm Yên có quả vỏ sần, tép cam vàng óng mọng nước, vị ngọt thanh pha chút chua dịu, là một trong những loại trái cây đặc sản nức tiếng cả nước."}], "heritage": ["Khu di tích quốc gia đặc biệt Tân Trào - Thủ đô kháng chiến", "Khu du lịch sinh thái Na Hang - Lâm Bình", "Suối khoáng nóng Mỹ Lâm"], "links": [{"title": "Cổng thông tin điện tử tỉnh Tuyên Quang", "url": "https://www.tuyenquang.gov.vn/"}, {"title": "Video tư liệu Tuyên Quang", "url": "https://www.tuyenquang.gov.vn/vi/media/video?id=8598&type=TYPE_VIDEO"}, {"title": "Bài viết: Cột cờ Lũng Cú biểu tượng thiêng liêng", "url": "https://www.tuyenquang.gov.vn/vi/post/cot-co-quoc-gia-lung-cu-bieu-tuong-thieng-lieng-tren-manh-dat-tuyen-quang-moi?id=153402&type=NEWS"}]}, "6": {"id": 6, "name": "Lào Cai", "short": "Lào Cai", "slug": "lao-cai", "regionId": "vung-1", "regionName": "Trung Du miền núi Bắc Bộ", "silhouette": "assets/silhouettes/06_lao_cai.png", "litColor": "#eab308", "quote": "Nóc nhà Đông Dương Fansipan · Sa Pa trong sương · Kỳ quan ruộng bậc thang", "overview": "Lào Cai là tỉnh vùng cao biên giới Tây Bắc, sở hữu đỉnh Fansipan 3.143m kiêu hãnh - \"Nóc nhà Đông Dương\", khu du lịch quốc tế Sa Pa, kỳ quan ruộng bậc thang Mù Cang Chải cùng nguồn tài nguyên Apatit độc nhất vô nhị của quốc gia.", "stats": [{"label": "Diện tích", "value": "13.256,9 km²", "sub": "Dãy Hoàng Liên Sơn kỳ vĩ"}, {"label": "Dân số", "valu icon": "mountain", "content": ["Hải Phòng kết hợp đô thị cảng, di sản công nghiệp – kiến trúc, các di tích ở Hải Dương và hệ sinh thái biển đảo Cát Bà. Sản phẩm du lịch gồm ẩm thực đô thị, nghỉ dưỡng biển, du thuyền và khám phá thiên nhiên.", "Hải Phòng là một trong những trung tâm cảng biển quan trọng nhất Việt Nam; sau hợp nhất, thành phố có thêm không gian di tích, làng nghề và nông nghiệp của Hải Dương."]}], "highlights": [{"title": "Quần đảo Cát Bà & Vịnh Lan Hạ", "image": "assets/images/ds_image13.jpeg", "caption": "Địa danh tiêu biểu: Quần đảo Cát Bà & Vịnh Lan Hạ", "desc": "Khu dự trữ sinh quyển thế giới và Di sản Thiên nhiên Thế giới UNESCO, vịnh biển thơ mộng với hàng trăm hòn đảo đá vôi kỳ thú."}, {"title": "Thành phố Cảng & Hoa phượng đỏ", "image": "assets/images/ds_image14.jpeg", "caption": "Địa danh tiêu biểu: Thành phố Cảng & Hoa phượng đỏ", "desc": "Cửa chính ra biển của miền Bắc, trung tâm logistics cảng nước sâu quốc tế Lạch Huyện hiện đại."}], "heritage": ["Quần đảo Cát Bà và vịnh Lan Hạ", "Côn Sơn – Kiếp Bạc"], "links": [{"title": "Tra cứu ảnh Hải Phòng trên Google Images", "url": "https://www.google.com/search?tbm=isch&q=qu%E1%BA%A7n%20%C4%91%E1%BA%A3o%20C%C3%A1t%20B%C3%A0%3B%20v%E1%BB%8Bnh%20Lan%20H%E1%BA%A1%3B%20C%C3%B4n%20S%C6%A1n%20Ki%E1%BA%BFp%20B%E1%BA%A1c"}, {"title": "Hình ảnh tư liệu Wikimedia Commons (Hải Phòng)", "url": "https://commons.wikimedia.org/w/index.php?search=qu%E1%BA%A7n%20%C4%91%E1%BA%A3o%20C%C3%A1t%20B%C3%A0%3B%20v%E1%BB%8Bnh%20Lan%20H%E1%BA%A1%3B%20C%C3%B4n%20S%C6%A1n%20Ki%E1%BA%BFp%20B%E1%BA%A1c&title=Special:MediaSearch&type=image"}]}, "35": {"id": 35, "name": "Đặc khu Hoàng Sa (Quần đảo Hoàng Sa)", "short": "Hoàng Sa", "slug": "hoang-sa", "regionId": "vung-4", "regionName": "Duyên hải Nam Trung Bộ và Tây Nguyên", "silhouette": "assets/silhouettes/35_hoang_sa.png", "litColor": "#f59e0b", "quote": "Chủ quyền thiêng liêng nơi đầu sóng · Hào khí Hùng binh Hoàng Sa · Cương vực ngàn đời của Tổ quốc", "overview": "Quần đảo Hoàng Sa (Paracel Islands, trong thư tịch cổ còn gọi là Bãi Cát Vàng) là một quần đảo san hô gồm khoảng 37 đảo, đá, cồn cát, bãi cạn và rạn san hô trên vùng biển rộng khoảng 30.000 km² ở phía đông miền Trung Việt Nam. Theo tổ chức hành chính Việt Nam sau sắp xếp năm 2025 (Nghị quyết 1659/NQ-UBTVQH15), đây là Đặc khu Hoàng Sa trực thuộc thành phố Đà Nẵng. Việt Nam khẳng định có đầy đủ cơ sở lịch sử và pháp lý vững chắc khẳng định chủ quyền không thể chối cãi đối với quần đảo Hoàng Sa theo luật pháp quốc tế.", "stats": [{"label": "Vùng biển", "value": "~30.000 km²", "sub": "Phần nổi ~10 km² (37 đảo, đá, rạn)"}, {"label": "Hành chính", "value": "01 Đặc khu", "sub": "Đặc khu Hoàng Sa, TP. Đà Nẵng"}, {"label": "Dân số", "value": "Lực lượng nhiệm vụ", "sub": "Ngư dân bám biển & nhân sự công tác"}, {"label": "Tọa độ cực", "value": "15°44′B – 17°06′B", "sub": "Kinh độ: 111°11′Đ – 112°53′Đ"}], "sections": [{"title": "Vị trí địa lý, Tên gọi & Cấu trúc địa hình", "icon": "geo", "content": ["Tên gọi: Quần đảo Hoàng Sa (tên quốc tế: Paracel Islands, sử liệu cổ Việt Nam ghi chép là \"Bãi Cát Vàng\"). Vị trí nằm ở phía đông đất liền miền Trung Việt Nam, thuộc Biển Đông, án ngữ các trục đường hàng hải quốc tế huyết mạch.", "Tọa độ các điểm cực: Cực Bắc (đảo Đá Bắc: 17°06′00″B, 111°30′08″Đ); Cực Nam (bãi ngầm Ốc Tai Voi: 15°44′02″B, 112°14′01″Đ); Cực Đông (bãi cạn Gò Nổi: 16°49′07″B, 112°53′04″Đ); Cực Tây (đảo Tri Tôn: 15°47′02″B, 111°11′08″Đ).", "Cấu trúc: Quần đảo gồm khoảng 37 đảo, đá, bãi cạn, bãi ngầm chia làm hai nhóm chính: Cụm Lưỡi Liềm (Trăng Khuyết) ở phía tây (Hoàng Sa, Hữu Nhật, Quang Ảnh, Quang Hòa, Duy Mộng, Tri Tôn...) và Cụm An Vĩnh ở phía đông bắc (Phú Lâm, đảo Cây, Linh Côn, bãi Bông Bay...)."]}, {"title": "Chủ quyền lịch sử & Căn cứ pháp lý vững chắc", "icon": "flag", "content": ["Lập trường Việt Nam: Việt Nam có đầy đủ cơ sở lịch sử và pháp lý vững chắc khẳng định chủ quyền đối với quần đảo Hoàng Sa. Thư tịch cổ, bản đồ cổ, Châu bản triều Nguyễn ghi chép hoạt động kiểm soát, tuần tra, khai thác liên tục của Hải đội Hoàng Sa và Đội Bắc Hải từ nhiều thế kỷ.", "Pháp lý quốc tế: Nhà nước Việt Nam qua các thời kỳ lịch sử đã xác lập và thực thi chủ quyền một cách hòa bình, thực chất, liên tục và phù hợp với luật pháp quốc tế, bao gồm Công ước Liên Hợp Quốc về Luật Biển 1982 (UNCLOS).", "Tình trạng thực tế: Trung Quốc dùng vũ lực chiếm đóng trái phép toàn bộ quần đảo Hoàng Sa từ năm 1974 sau cuộc xung đột quân sự với lực lượng quân đội Việt Nam Cộng hòa. Việt Nam liên tục lên tiếng phản đối và kiên quyết khẳng định chủ quyền không thể chối cãi."]}, {"title": "An ninh – Quốc phòng & Diễn biến Biển Đông (Cập nhật 2026)", "icon": "shield", "content": ["Ý nghĩa phòng thủ: Hoàng Sa giữ vai trò tiền tiêu đặc biệt trọng yếu đối với việc kiểm soát, quan sát, bảo đảm thông tin liên lạc, an toàn hàng hải và an ninh vùng biển phía bắc Biển Đông.", "Diễn biến đáng chú ý năm 2026: Việt Nam liên tục theo dõi sát sao và lên tiếng kiên quyết phản đối các hoạt động cải tạo, xây dựng trái phép của Trung Quốc tại các thực thể như rạn Hải Sâm (Antelope Reef) và đảo Ba Ba (Yagong).", "Ngày 28/08/2026, Người phát ngôn Bộ Ngoại giao Việt Nam chính thức tuyên bố phản đối mọi hoạt động xâm phạm chủ quyền, yêu cầu tôn trọng luật pháp quốc tế, DOC và không làm phức tạp thêm tình hình trên Biển Đông."]}, {"title": "Vị trí chiến lược & Giá trị kinh tế biển", "icon": "trend", "content": ["Tuyến hàng hải huyết mạch: Nằm gần tuyến hàng hải quốc tế kết nối Đông Bắc Á với Đông Nam Á, Ấn Độ Dương và châu Âu, vận chuyển hàng tỷ thùng dầu và nguồn năng lượng LNG trọng yếu mỗi năm.", "Khai thác hải sản: Vùng biển Hoàng Sa là ngư trường truyền thống của ngư dân Đà Nẵng, Quảng Ngãi, Quảng Nam với nguồn lợi hải sản phong phú ngàn đời.", "Tiềm năng nghiên cứu & khoáng sản: Tiềm năng năng lượng thềm lục địa, nguồn tài nguyên khoáng sản biển sâu và giá trị vô giá cho nghiên cứu hải dương học, hệ sinh thái rạn san hô nhiệt đới."]}], "highlights": [{"title": "Đảo Hoàng Sa (Pattle Island) & Cụm Lưỡi Liềm", "image": "assets/images/hoang_sa_island.jpg", "caption": "Vẻ đẹp kỳ vĩ của đảo Hoàng Sa giữa biển trời xanh biếc", "desc": "Đảo san hô hình vòng cung nổi tiếng nằm ở phía tây quần đảo. Thảm thực vật xanh tươi, bãi cát trắng mịn bao quanh bởi làn nước màu ngọc bích tuyệt mỹ, là biểu tượng thiêng liêng của quần đảo Hoàng Sa."}, {"title": "Đảo Phú Lâm & Nhóm An Vĩnh", "image": "assets/images/ds_image6.jpeg", "caption": "Đảo Phú Lâm - thực thể có diện tích đất nổi lớn nhất quần đảo", "desc": "Nằm trong cụm An Vĩnh phía đông bắc, là thực thể đảo san hô có diện tích nổi tự nhiên lớn nhất (khoảng 2,1 km²), giữ vị trí quan sát chiến lược bao quát vùng biển phía bắc."}, {"title": "Đảo Tri Tôn & Ngư trường Hoàng Sa", "image": "assets/images/ds_image25.webp", "caption": "Vùng biển Lý Sơn - cửa ngõ vươn khơi hướng về Hoàng Sa", "desc": "Đảo Tri Tôn nằm ở cực tây nam của quần đảo Hoàng Sa, là ngư trường truyền thống của ngư dân các tỉnh miền Trung Việt Nam suốt nhiều thế kỷ."}, {"title": "Nhà trưng bày Hoàng Sa bên bờ biển Đà Nẵng", "image": "assets/images/ds_image16.jpeg", "caption": "Nhà trưng bày Hoàng Sa tại đường Hoàng Sa, TP. Đà Nẵng", "desc": "Công trình kiến trúc hình Con dấu chủ quyền của các vua triều Nguyễn, nơi lưu giữ hàng trăm tấm bản đồ cổ, Châu bản triều Nguyễn và hiện vật lịch sử khẳng định chủ quyền bất khả xâm phạm của Việt Nam."}], "heritage": ["Lễ khao lề thế lính Hoàng Sa (Di sản phi vật thể quốc gia)", "Di tích Đội Hoàng Sa kiêm quản Bắc Hải (Đảo Lý Sơn)", "Hệ thống Châu bản triều Nguyễn về chủ quyền Hoàng Sa", "Nhà trưng bày Hoàng Sa (Đường Hoàng Sa, TP. Đà Nẵng)"], "links": [{"title": "Cổng thông tin điện tử UBND TP. Đà Nẵng (Đặc khu Hoàng Sa)", "url": "https://danang.gov.vn/"}, {"title": "Tra cứu tư liệu Quần đảo Hoàng Sa trên Google Images", "url": "https://www.google.com/search?tbm=isch&q=Qu%E1%BA%A7n+%C4%91%E1%BA%A3o+Ho%C3%A0ng+Sa+Vi%E1%BB%87t+Nam"}, {"title": "Hình ảnh tư liệu Hoàng Sa (Paracel Islands) - Wikimedia Commons", "url": "https://commons.wikimedia.org/w/index.php?search=Paracel+Islands&title=Special:MediaSearch&type=image"}]}, "36": {"id": 36, "name": "Huyện Trường Sa (Quần đảo Trường Sa)", "short": "Trường Sa", "slug": "truong-sa", "regionId": "vung-4", "regionName": "Duyên hải Nam Trung Bộ và Tây Nguyên", "silhouette": "assets/silhouettes/36_truong_sa.png", "litColor": "#06b6d4", "quote": "Trường Sa vì cả nước, cả nước vì Trường Sa · Lá chắn tiền tiêu hiên ngang giữa biển trời Tổ quốc", "overview": "Quần đảo Trường Sa (Spratly Islands) nằm ở phía nam Biển Đông, gồm hơn 100 đảo nổi, đảo chìm, bãi đá ngầm và rạn san hô trải rộng trên vùng biển chiến lược từ 160.000 đến 410.000 km². Theo tổ chức hành chính Việt Nam, quần đảo là huyện Trường Sa thuộc tỉnh Khánh Hòa, gồm 1 thị trấn (Trường Sa) và 2 xã đảo (Song Tử Tây, Sinh Tồn). Nơi đây giữ vị trí yết hầu về quốc phòng - an ninh trên biển, nằm sát ngã tư các tuyến hàng hải quốc tế nhộn nhịp bậc nhất thế giới. Quân và dân Trường Sa ngày đêm vững vàng nơi đầu sóng ngọn gió, bảo vệ trọn vẹn chủ quyền biển đảo thiêng liêng.", "stats": [{"label": "Vùng biển", "value": "160.000 – 410.000 km²", "sub": "Phần nổi tự nhiên ~2 - 11 km² (>100 đảo, đá, rạn)"}, {"label": "Hành chính", "value": "1 thị trấn, 2 xã", "sub": "TT. Trường Sa, xã Song Tử Tây, xã Sinh Tồn"}, {"label": "Dân số", "value": "Quân & dân huyện đảo", "sub": "Cộng đồng cư dân, trường học, trạm xá, âu tàu"}, {"label": "Tọa độ cực", "value": "06°30′B – 12°00′B", "sub": "Kinh độ: 111°30′Đ – 117°20′Đ"}], "sections": [{"title": "Vị trí địa lý, Tên gọi & Hệ thống các cụm đảo", "icon": "geo", "content": ["Tên gọi: Quần đảo Trường Sa (tên quốc tế: Spratly Islands). Nằm ở khu vực phía nam Biển Đông, án ngữ cửa ngõ hàng hải giao thương quốc tế nối Ấn Độ Dương với Thái Bình Dương.", "Hệ thống thực thể đảo: Gồm hơn 100 đảo, đá, rạn san hô, bãi cạn và bãi ngầm phân bố thành nhiều cụm: Cụm Song Tử (Song Tử Tây, Song Tử Đông), Cụm Loại Ta, Cụm Nam Yết (Nam Yết, Sơn Ca), Cụm Sinh Tồn, Cụm Trường Sa Lớn, Cụm An Bang, Cụm Tiên Nữ.", "Đặc điểm tự nhiên: Khí hậu nhiệt đới gió mùa biển, nhiều nắng và gió bão khắc nghiệt. Đất đảo cát san hô cằn cỗi nhưng dưới bàn tay quân và dân ta nay đã xanh tươi bóng cây bàng vuông, mù u, tra biển."]}, {"title": "Chủ quyền thiêng liêng & Quản lý thực tế", "icon": "flag", "content": ["Căn cứ lịch sử và pháp lý: Việt Nam khẳng định có đầy đủ cơ sở lịch sử và chứng cứ pháp lý xác lập chủ quyền đối với quần đảo Trường Sa qua nhiều thế kỷ, thực thi quyền chủ quyền liên tục và hòa bình.", "Quản lý thực tế: Hiện nay, Việt Nam đang quản lý thực tế 21 thực thể đảo, đá, rạn san hô trong quần đảo Trường Sa cùng hệ thống các Trạm Dịch vụ Kinh tế - Khoa học kỹ thuật (nhà giàn DK1) trên thềm lục địa phía Nam.", "Tuân thủ pháp luật quốc tế: Việt Nam kiên quyết bảo vệ chủ quyền bằng biện pháp hòa bình, trên cơ sở luật pháp quốc tế, đặc biệt là UNCLOS 1982 và nỗ lực cùng ASEAN hoàn thiện Bộ Quy tắc Ứng xử Biển Đông (COC)."]}, {"title": "Đời sống quân dân, Giáo dục & Y tế hải đảo", "icon": "users", "content": ["Hạ tầng dân sinh khang trang: Đảo Trường Sa Lớn, Song Tử Tây, Sinh Tồn có trường tiểu học kiên cố, các lớp học rộn rã tiếng giảng bài của thầy cô và tiếng cười trẻ thơ.", "Y tế biển đảo: Bệnh xá quân dân y trên các đảo được trang bị máy móc hiện đại, hệ thống Telemedicine kết nối trực tiếp với các bệnh viện đầu ngành trong đất liền, kịp thời cấp cứu chiến sĩ và ngư dân.", "Năng lượng xanh & phủ sóng 4G: Hệ thống pin năng lượng mặt trời, tua-bin gió và mạng viễn thông Viettel phủ sóng toàn huyện đảo, kết nối Trường Sa gần hơn với đất liền."]}, {"title": "Hậu cần nghề cá & Ngã tư hàng hải quốc tế", "icon": "trend", "content": ["Điểm tựa của ngư dân: Các âu tàu tại Trường Sa Lớn, Song Tử Tây, Sinh Tồn, Đá Tây có khả năng tiếp nhận hàng trăm tàu cá vào tránh trú bão, được cung cấp miễn phí nước ngọt, khám bệnh và hỗ trợ sửa chữa máy móc.", "Hệ thống Hải đăng quốc gia: Những ngọn hải đăng sừng sững (Trường Sa Lớn, Song Tử Tây, Đá /search?tbm=isch&q=Qu%E1%BA%A7n+%C4%91%E1%BA%A3o+Tr%C6%B0%E1%BB%9Dng+Sa+Vi%E1%BB%87t+Nam"}, {"title": "Hình ảnh tư liệu Trường Sa (Spratly Islands) - Wikimedia Commons", "url": "https://commons.wikimedia.org/w/index.php?search=Spratly+Islands&title=Special:MediaSearch&type=image"}]}};

const REGIONS_LIST = [
  {id: 'all', name: 'Tất cả 36 địa phương & quần đảo'},
  {id: 'vung-1', name: 'Trung Du & MN Bắc Bộ (9)'},
  {id: 'vung-2', name: 'Đồng bằng sông Hồng (6)'},
  {id: 'vung-3', name: 'Bắc Trung Bộ (5)'},
  {id: 'vung-4', name: 'Nam Trung Bộ, Tây Nguyên & Biển Đảo (8)'},
  {id: 'vung-5', name: 'Đông Nam Bộ (8)'}
];

const ALL_IDS = Object.keys(DATA).map(Number).sort((a,b)=>a-b);

function getUrlId() {
  const params = new URLSearchParams(window.location.search);
  const qId = parseInt(params.get('id'));
  if (qId && DATA[qId]) return qId;
  const qSlug = params.get('slug');
  if (qSlug) {
    const found = ALL_IDS.find(id => DATA[id] && DATA[id].slug === qSlug);
    if (found) return found;
  }
  return 5; // Default: Tuyên Quang
}

let currentId = getUrlId();
let currentRegionFilter = (DATA[currentId] && DATA[currentId].regionId) || 'all';

function renderRegionTabs() {
  const container = document.getElementById('region-tabs');
  container.replaceChildren();
  REGIONS_LIST.forEach(r => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'reg-tab-btn' + (r.id === currentRegionFilter ? ' is-active' : '');
    btn.textContent = r.name;
    btn.onclick = () => {
      currentRegionFilter = r.id;
      renderRegionTabs();
      renderSwitcherPills();
    };
    container.append(btn);
  });
}

function renderSwitcherPills() {
  const container = document.getElementById('switcher-pills');
  container.replaceChildren();
  const list = (currentRegionFilter === 'all') 
    ? ALL_IDS 
    : ALL_IDS.filter(id => DATA[id] && DATA[id].regionId === currentRegionFilter);

  list.forEach(oId => {
    const item = DATA[oId];
    if (!item) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'switch-pill' + (oId === currentId ? ' is-current' : '');
    btn.innerHTML = `<span class="p-dot" style="background:${item.litColor}"></span><span>${item.short}</span>`;
    btn.addEventListener('click', () => {
      renderPage(oId);
      window.scrollTo({top: 0, behavior: 'smooth'});
    });
    container.append(btn);
  });
}

function renderPage(id) {
  const p = DATA[id];
  if (!p) return;
  currentId = id;
  currentRegionFilter = p.regionId;

  // Update browser URL without reload
  const url = new URL(window.location.href);
  url.searchParams.set('id', id);
  window.history.replaceState({id}, '', url.toString());

  document.title = `${p.name} — Thông tin & Hình ảnh đầy đủ · Việt Nam Atlas`;

  // Top badge
  document.getElementById('top-dot').style.background = p.litColor;
  document.getElementById('top-region-text').textContent = p.regionName;

  // Switchers
  renderRegionTabs();
  renderSwitcherPills();

  // Hero section
  document.getElementById('hero-tag-text').textContent = `📍 ${p.regionName.toUpperCase()}`;
  document.getElementById('hero-name').textContent = p.name;
  document.getElementById('hero-quote').textContent = p.quote || '';
  document.getElementById('hero-desc').textContent = p.overview || '';
  document.getElementById('silhouette-img').src = p.silhouette;
  document.getElementById('silhouette-img').alt = 'Bản đồ ranh giới ' + p.name;
  document.getElementById('hero-id-tag').textContent = (p.id >= 35) ? `QUẦN ĐẢO THIÊNG LIÊNG #${String(p.id).padStart(2,'0')}` : `TỈNH THÀNH #${String(p.id).padStart(2,'0')}`;

  // Key stats
  const statsGrid = document.getElementById('stats-grid');
  statsGrid.replaceChildren();
  (p.stats || []).forEach(st => {
    const card = document.createElement('div');
    card.className = 'stat-card';
    card.innerHTML = `
      <div class="stat-label">${st.label}</div>
      <div class="stat-val">${st.value}</div>
      <div class="stat-sub">${st.sub}</div>
    `;
    statsGrid.append(card);
  });

  // Section cards
  const sectionGrid = document.getElementById('section-grid');
  sectionGrid.replaceChildren();
  (p.sections || []).forEach(sec => {
    const card = document.createElement('div');
    card.className = 'card';
    const itemsHtml = (sec.content || []).map(t => `<li>${t}</li>`).join('');
    card.innerHTML = `
      <div class="card-header">
        <div class="card-icon">📌</div>
        <h3 class="card-title">${sec.title}</h3>
      </div>
      <ul class="info-list">${itemsHtml}</ul>
    `;
    sectionGrid.append(card);
  });

  // Highlights & photo gallery
  const highGrid = document.getElementById('highlights-grid');
  highGrid.replaceChildren();
  (p.highlights || []).forEach(h => {
    const card = document.createElement('article');
    card.className = 'highlight-card';
    card.innerHTML = `
      <div class="img-wrap" title="Nhấn để phóng to ảnh">
        <img class="highlight-img" src="${h.image}" alt="${h.title}" loading="lazy">
        <span class="img-badge">📷 HÌNH ẢNH / DANH THẮNG</span>
      </div>
      <div class="highlight-body">
        <h3 class="highlight-title">${h.title}</h3>
        <p class="highlight-caption">${h.caption || ''}</p>
        <p class="highlight-desc">${h.desc || ''}</p>
      </div>
    `;
    const imgWrap = card.querySelector('.img-wrap');
    imgWrap.addEventListener('click', () => openModal(h.image, `${h.title} — ${h.caption}`));
    highGrid.append(card);
  });

  // Heritage list
  const herList = document.getElementById('heritage-list');
  herList.replaceChildren();
  (p.heritage || []).forEach(h => {
    const badge = document.createElement('span');
    badge.className = 'heritage-badge';
    badge.innerHTML = `<span>★</span><span>${h}</span>`;
    herList.append(badge);
  });

  // Links list
  const linksList = document.getElementById('links-list');
  linksList.replaceChildren();
  (p.links || []).forEach(lnk => {
    const a = document.createElement('a');
    a.className = 'ext-link';
    a.href = lnk.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.innerHTML = `<span>${lnk.title}</span><span style="color:#7a8a76">↗</span>`;
    linksList.append(a);
  });

  // Next / Prev button setup
  const idx = ALL_IDS.indexOf(id);
  const prevId = ALL_IDS[(idx - 1 + ALL_IDS.length) % ALL_IDS.length];
  const nextId = ALL_IDS[(idx + 1) % ALL_IDS.length];
  
  const prevBtn = document.getElementById('prev-btn');
  prevBtn.textContent = `← ${DATA[prevId].short}`;
  prevBtn.onclick = () => { renderPage(prevId); window.scrollTo({top:0, behavior:'smooth'}); };

  const nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = `${DATA[nextId].short} →`;
  nextBtn.onclick = () => { renderPage(nextId); window.scrollTo({top:0, behavior:'smooth'}); };
}

// Lightbox Modal
const modal = document.getElementById('image-modal');
const modalImg = document.getElementById('modal-img');
const modalCap = document.getElementById('modal-caption');
const modalClose = document.getElementById('modal-close');

function openModal(src, cap) {
  modalImg.src = src;
  modalCap.textContent = cap;
  modal.classList.add('is-open');
}

modalClose.addEventListener('click', () => modal.classList.remove('is-open'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('is-open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('is-open'); });

// Initial render
renderPage(currentId);
</script>
