<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quần Đảo Trường Sa - Việt Nam</title>
    <style>
        :root {
            --bg-ocean: #0f172a;
            --accent-gold: #f59e0b;
            --text-light: #f8fafc;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-ocean);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #38bdf8;
            text-transform: uppercase;
        }

        p.subtitle {
            margin: 5px 0 0;
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }

        .map-wrapper {
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border: 2px solid #334155;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        svg {
            display: block;
            width: 800px;
            height: 600px;
        }

        /* Styling for SVG Elements */
        .grid-line {
            stroke: #334155;
            stroke-dasharray: 4 4;
            stroke-width: 0.5;
        }

        .grid-text {
            fill: #64748b;
            font-size: 10px;
            font-family: monospace;
        }

        .island-major {
            fill: #ef4444;
            stroke: #fca5a5;
            stroke-width: 1.5;
            filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.8));
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .island-major:hover {
            fill: #f59e0b;
            stroke: #fde047;
            transform: scale(1.15);
        }

        .island-reef {
            fill: #38bdf8;
            opacity: 0.6;
            stroke: #7dd3fc;
            stroke-width: 0.8;
            cursor: pointer;
        }

        .island-reef:hover {
            opacity: 1;
            fill: #f59e0b;
        }

        .tiny-atoll {
            fill: #f59e0b;
            opacity: 0.5;
            animation: pulse 2s infinite alternate;
        }

        .island-label {
            fill: #f8fafc;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            text-anchor: start;
            text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000;
        }

        .compass-ring {
            fill: none;
            stroke: #475569;
            stroke-width: 1;
        }

        .compass-text {
            fill: #38bdf8;
            font-size: 12px;
            font-weight: bold;
            text-anchor: middle;
        }

        @keyframes pulse {
            from { opacity: 0.3; transform: scale(0.9); }
            to { opacity: 0.8; transform: scale(1.2); }
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #38bdf8;
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
            pointer-events: none;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <h1>Quần Đảo Trường Sa</h1>
        <p class="subtitle">Chủ quyền Việt Nam - Tọa độ Địa lý & Các Đảo / Đá / Bãi ngầm</p>
    </header>

    <div class="controls">
        <button onclick="downloadPNG()">Tải file ảnh PNG</button>
        <button onclick="toggleLabels()">Ẩn/Hiện Tên Đảo</button>
    </div>

    <div class="map-wrapper" id="mapWrapper">
        <div class="tooltip" id="tooltip"></div>
        <svg id="truongSaSVG" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
            <!-- Background Elements -->
            <defs>
                <radialGradient id="oceanGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#1e293b"/>
                    <stop offset="100%" stop-color="#0f172a"/>
                </radialGradient>
                <radialGradient id="glow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
                    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
                </radialGradient>
            </defs>

            <!-- Grid Lines (Kinh tuyến / Vĩ tuyến) -->
            <g id="grid">
                <line x1="100" y1="0" x2="100" y2="600" class="grid-line"/>
                <text x="105" y="20" class="grid-text">111°E</text>

                <line x1="300" y1="0" x2="300" y2="600" class="grid-line"/>
                <text x="305" y="20" class="grid-text">113°E</text>

                <line x1="500" y1="0" x2="500" y2="600" class="grid-line"/>
                <text x="505" y="20" class="grid-text">115°E</text>

                <line x1="700" y1="0" x2="700" y2="600" class="grid-line"/>
                <text x="705" y="20" class="grid-text">117°E</text>

                <line x1="0" y1="100" x2="800" y2="100" class="grid-line"/>
                <text x="10" y="95" class="grid-text">11°N</text>

                <line x1="0" y1="280" x2="800" y2="280" class="grid-line"/>
                <text x="10" y="275" class="grid-text">10°N</text>

                <line x1="0" y1="460" x2="800" y2="460" class="grid-line"/>
                <text x="10" y="455" class="grid-text">9°N</text>
            </g>

            <!-- Dòng chữ bản quyền/Tiêu đề dưới -->
            <text x="780" y="580" fill="#64748b" font-size="12" text-anchor="end" font-weight="bold">QUẦN ĐẢO TRƯỜNG SA (VIỆT NAM)</text>

            <!-- Dải các đảo nhỏ li ti làm nền (Atolls & Coral Reefs Background) -->
            <g id="tinyIslands"></g>

            <!-- Các Cụm Đảo & Đảo Chính -->
            <g id="islands">
                <!-- Đảo Song Tử Tây -->
                <g class="island-group" data-name="Đảo Song Tử Tây">
                    <circle cx="280" cy="90" r="15" fill="url(#glow)"/>
                    <path d="M277,88 Q282,85 284,90 T279,93 Z" class="island-major"/>
                    <text x="290" y="88" class="island-label">Đ. Song Tử Tây</text>
                </g>

                <!-- Đảo Song Tử Đông -->
                <g class="island-group" data-name="Đảo Song Tử Đông">
                    <path d="M295,85 Q298,83 300,87 T296,89 Z" class="island-reef"/>
                    <text x="305" y="83" class="island-label">Song Tử Đông</text>
                </g>

                <!-- Đảo Loại Ta -->
                <g class="island-group" data-name="Đảo Loại Ta">
                    <path d="M380,140 Q385,138 388,143 T382,145 Z" class="island-reef"/>
                    <text x="393" y="142" class="island-label">Đ. Loại Ta</text>
                </g>

                <!-- Đảo Nam Yết -->
                <g class="island-group" data-name="Đảo Nam Yết">
                    <circle cx="370" cy="210" r="18" fill="url(#glow)"/>
                    <path d="M365,208 Q372,205 375,210 T368,214 Z" class="island-major"/>
                    <text x="382" y="212" class="island-label">Đ. Nam Yết</text>
                </g>

                <!-- Đảo Sơn Ca -->
                <g class="island-group" data-name="Đảo Sơn Ca">
                    <path d="M395,195 Q400,192 402,196 T397,198 Z" class="island-major"/>
                    <text x="408" y="196" class="island-label">Đ. Sơn Ca</text>
                </g>

                <!-- Đảo Sinh Tồn -->
                <g class="island-group" data-name="Đảo Sinh Tồn">
                    <circle cx="410" cy="240" r="15" fill="url(#glow)"/>
                    <path d="M405,238 Q412,236 415,241 T408,243 Z" class="island-major"/>
                    <text x="422" y="241" class="island-label">Đ. Sinh Tồn</text>
                </g>

                <!-- Đảo Ba Bình -->
                <g class="island-group" data-name="Đảo Ba Bình">
                    <path d="M420,202 Q426,200 428,205 T422,207 Z" class="island-reef"/>
                    <text x="433" y="204" class="island-label">Đ. Ba Bình</text>
                </g>

                <!-- Đảo Trường Sa Chính (Trường Sa Lớn) -->
                <g class="island-group" data-name="Đảo Trường Sa">
                    <circle cx="260" cy="420" r="22" fill="url(#glow)"/>
                    <path d="M252,415 Q265,410 268,422 T255,426 Z" class="island-major"/>
                    <text x="275" y="422" class="island-label" font-size="13" fill="#fde047">Đ. TRƯỜNG SA</text>
                </g>

                <!-- Đảo An Bang -->
                <g class="island-group" data-name="Đảo An Bang">
                    <path d="M340,490 Q344,488 346,492 T341,494 Z" class="island-major"/>
                    <text x="352" y="492" class="island-label">Đ. An Bang</text>
                </g>

                <!-- Đá Tây / Đá Đông / Đá Việt -->
                <g class="island-group" data-name="Đá Tây">
                    <polygon points="230,425 235,423 238,428 232,430" class="island-reef"/>
                    <text x="200" y="435" class="island-label">Đá Tây</text>
                </g>

                <g class="island-group" data-name="Đá Đông">
                    <polygon points="290,430 296,428 298,434 291,435" class="island-reef"/>
                    <text x="302" y="437" class="island-label">Đá Đông</text>
                </g>

                <!-- Đá Tiên Nữ -->
                <g class="island-group" data-name="Đá Tiên Nữ">
                    <path d="M520,380 Q525,375 528,382 T522,385 Z" class="island-reef"/>
                    <text x="532" y="382" class="island-label">Đá Tiên Nữ</text>
                </g>

                <!-- Đá Tốc Tan -->
                <g class="island-group" data-name="Đá Tốc Tan">
                    <ellipse cx="380" cy="440" rx="6" ry="3" class="island-reef"/>
                    <text x="390" y="444" class="island-label">Đá Tốc Tan</text>
                </g>
            </g>

            <!-- Dấu chỉ hướng Bắc (Compass) -->
            <g transform="translate(720, 80)">
                <circle cx="0" cy="0" r="30" class="compass-ring"/>
                <line x1="0" y1="-25" x2="0" y2="25" stroke="#475569" stroke-width="1"/>
                <line x1="-25" y1="0" x2="25" y2="0" stroke="#475569" stroke-width="1"/>
                <polygon points="0,-28 -6,-10 0,-15 6,-10" fill="#ef4444"/>
                <polygon points="0,28 -6,10 0,15 6,10" fill="#94a3b8"/>
                <text x="0" y="-32" class="compass-text">N</text>
            </g>
        </svg>
    </div>

    <!-- Canvas ẩn dùng cho việc render ra hình ảnh PNG -->
    <canvas id="hiddenCanvas" width="1600" height="1200" style="display: none;"></canvas>

    <script>
        // Tự động khởi tạo hàng trăm đảo li ti / bãi san hô ngầm ngẫu nhiên theo tọa độ thực tế
        function generateTinyIslands() {
            const container = document.getElementById('tinyIslands');
            const count = 180; // Số lượng đảo li ti

            // Cụm phân bố trung tâm đảo
            const clusters = [
                { x: 290, y: 90, r: 40 },   // Cụm Song Tử
                { x: 380, y: 200, r: 60 },  // Cụm Nam Yết / Sinh Tồn
                { x: 270, y: 420, r: 80 },  // Cụm Trường Sa lớn
                { x: 450, y: 350, r: 100 }, // Cụm An Bang / Tiên Nữ
            ];

            for (let i = 0; i < count; i++) {
                // Chọn ngẫu nhiên 1 cụm để tạo hạt xung quanh
                const cluster = clusters[Math.floor(Math.random() * clusters.length)];
                
                // Tọa độ Gauss nhẹ xung quanh cụm
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * cluster.r * 1.5;
                const cx = cluster.x + Math.cos(angle) * dist;
                const cy = cluster.y + Math.sin(angle) * dist;

                const r = Math.random() * 1.8 + 0.5; // Bán kính siêu nhỏ

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', cx);
                circle.setAttribute('cy', cy);
                circle.setAttribute('r', r);
                circle.setAttribute('class', 'tiny-atoll');
                circle.style.animationDelay = `${Math.random() * 2}s`;

                container.appendChild(circle);
            }
        }

        // Tương tác Tooltip khi di chuột
        const tooltip = document.getElementById('tooltip');
        document.querySelectorAll('.island-group').forEach(item => {
            item.addEventListener('mousemove', (e) => {
                const rect = document.getElementById('mapWrapper').getBoundingClientRect();
                const name = item.getAttribute('data-name');
                tooltip.style.display = 'block';
                tooltip.style.left = (e.clientX - rect.left + 10) + 'px';
                tooltip.style.top = (e.clientY - rect.top + 10) + 'px';
                tooltip.innerHTML = `<strong>${name}</strong><br/><span style="color:#94a3b8;font-size:10px;">Chủ quyền Việt Nam</span>`;
            });

            item.addEventListener('mouseleave', () => {
                tooltip.style.display = 'none';
            });
        });

        // Toggle Ẩn / Hiện tên đảo
        let labelsVisible = true;
        function toggleLabels() {
            labelsVisible = !labelsVisible;
            document.querySelectorAll('.island-label').forEach(el => {
                el.style.display = labelsVisible ? 'block' : 'none';
            });
        }

        // Tải xuống dưới dạng tệp ảnh PNG chất lượng cao
        function downloadPNG() {
            const svgElement = document.getElementById('truongSaSVG');
            const svgString = new XMLSerializer().serializeToString(svgElement);
            
            const canvas = document.getElementById('hiddenCanvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();

            // Render nền biển lên Canvas trước
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const URL = window.URL || window.webkitURL || window;
            const blobURL = URL.createObjectURL(svgBlob);

            img.onload = function() {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                const pngURL = canvas.toDataURL('image/png');
                const downloadLink = document.createElement('a');
                downloadLink.href = pngURL;
                downloadLink.download = 'Truong_Sa_Viet_Nam_Map.png';
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            };

            img.src = blobURL;
        }

        // Chạy khởi tạo
        generateTinyIslands();
    </script>
</body>
</html>
